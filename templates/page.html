{% extends "base.html" %}
{% block content %}

<header>
  {% if "status" in page.extra %}
  {% set status = page.extra.status %}
  {% else %}
  {% set status = "stub" %}
  {% endif %}
  <h1 class="page-title {{ status }}">
    {{ page.title }}
  </h1>
  {% if page.description %}
  <div class="page-subtitle">
    {{ page.description }}
  </div>
  {% endif %}
</header>

<div id="content">
{{ page.content | safe }}
</div>

{% endblock content %}
