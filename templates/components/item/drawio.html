{% component item.drawio(file: string, page: map, width: string = "100%") %}

{% set mw = width | default(value="100%") %}

<div
  class="drawio mxgraph"
  style="max-width: {{ mw }};"
  data-mxgraph='{
    "url":"{{ page.path ~ "/" ~ file }}",
    "lightbox": false,
    "center": true,
    "responsive": true,
    "allow-zoom-in": true
  }'>
</div>

{% endcomponent item.drawio %}
