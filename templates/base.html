<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Zach Notes</title>

  <!-- Applied before first paint, to avoid the navbar flashing when collapsed.
       Collapsed is the default, so the dropdown doesn't cover the page on load. -->
  <script>
    if (localStorage.getItem("navCollapsed") !== "false") {
      document.documentElement.classList.add("nav-collapsed");
    }
  </script>

  <link rel="stylesheet" href="{{ get_url(path="base.css") }}">
  <link rel="stylesheet" href="{{ get_url(path="nav.css") }}">
  <link rel="stylesheet" href="{{ get_url(path="content.css") }}">
  <link rel="stylesheet" href="{{ get_url(path="pdf.css") }}">
  <link rel="stylesheet" href="{{ get_url(path="paper.css") }}">

  <!-- Get cdn links from: https://cdnjs.com/libraries -->

  <!-- https://katex.org/docs/browser -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.css"
    integrity="sha384-Pu5+C18nP5dwykLJOhd2U4Xen7rjScHN/qusop27hdd2drI+lL5KvX7YntvT8yew"
    crossorigin="anonymous">
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.js"
    integrity="sha384-2B8pfmZZ6JlVoScJm/5hQfNS2TI/6hPqDZInzzPc8oHpN5SgeNOf4LzREO6p5YtZ"
    crossorigin="anonymous">
  </script>
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/contrib/auto-render.min.js"
    integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh"
    crossorigin="anonymous">
  </script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/elasticlunr/0.9.6/elasticlunr.min.js"
    integrity="sha512-0QarUp4p9r5IqUgSRyP89BHga45OpEd7VR8lbRkJkf48p/EhcU742fWUpKpoDyu9N6XYAEq/vz6m6z1OolnsDw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
  </script>

  <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.530/web/pdf_viewer.min.css">-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

  <script defer src="https://viewer.diagrams.net/js/viewer-static.min.js"></script>

  <script defer type="module" src="{{ get_url(path="scripts/katex.js") }}">
  </script>
  <!-- Must come after katex.js -->
  <script defer type="module" src="{{ get_url(path="scripts/keywords.js") }}">
  </script>
  <script defer type="module" src="{{ get_url(path="scripts/pdf.js") }}">
  </script>
  <script defer type="module" src="{{ get_url(path="scripts/paper.js") }}">
  </script>
  <script defer type="module" src="{{ get_url(path="scripts/details.js") }}">
  </script>
  <script defer type="module" src="{{ get_url(path="scripts/scroll.js") }}">
  </script>
  <script defer type="module" src="{{ get_url(path="scripts/navbar.js") }}">
  </script>
  <script type="application/json" id="keyword-index">
    {{ <kw.index/> }}
  </script>

</head>

<body>

  {% include "partials/navbar.html" %}

  <main>
    {% block content %}
    {% endblock content %}
  </main>
</body>
</html>
